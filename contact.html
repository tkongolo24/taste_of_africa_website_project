<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Taste of Africa and share your thoughts about African cuisine.">

    <title>Contact Us | Taste of Africa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- NAVIGATION -->
    <header class="site-header">
        <div class="container header-inner">

            <a href="index.html" class="logo">Taste of Africa</a>

            <nav aria-label="Main navigation">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="recipes.html">Recipes</a></li>
                    <li><a href="region-east.html">Regions</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>

            <button
                id="theme-toggle"
                class="theme-toggle"
                type="button"
                aria-label="Toggle dark and light mode">
                🌙
            </button>

        </div>
    </header>

    <main>

        <!-- PAGE BANNER -->
        <header class="page-banner">
            <h1>Contact Us</h1>
            <p>We would love to hear from you. Share your thoughts about African cuisine!</p>
        </header>

        <!-- CONTACT FORM -->
        <section class="section container">

            <form id="contact-form" class="form-card" novalidate>

                <!-- NAME -->
                <div class="form-group">
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                        autocomplete="name">

                    <p class="error-msg" id="name-error" aria-live="polite"></p>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                        autocomplete="email">

                    <p class="error-msg" id="email-error" aria-live="polite"></p>
                </div>

                <!-- COUNTRY WITH DATALIST -->
                <div class="form-group">
                    <label for="country">Country</label>

                    <input
                        type="text"
                        id="country"
                        name="country"
                        list="country-list"
                        placeholder="Start typing your country..."
                        required
                        autocomplete="country-name">

                    <datalist id="country-list">
                        <option value="Rwanda">
                        <option value="Nigeria">
                        <option value="Ghana">
                        <option value="Kenya">
                        <option value="Ethiopia">
                        <option value="Morocco">
                        <option value="South Africa">
                        <option value="Uganda">
                        <option value="Tanzania">
                        <option value="Egypt">
                        <option value="Senegal">
                        <option value="Cameroon">
                        <option value="Benin">
                        <option value="Algeria">
                        <option value="Zimbabwe">
                        <option value="Zambia">
                        <option value="Democratic Republic of the Congo">
                        <option value="Other">
                    </datalist>

                    <p class="error-msg" id="country-error" aria-live="polite"></p>
                </div>

                <!-- FAVOURITE DISH -->
                <div class="form-group">
                    <label for="dish">Favorite African dish (optional)</label>

                    <input
                        type="text"
                        id="dish"
                        name="dish"
                        list="dish-list"
                        placeholder="What is your favorite dish?">

                    <datalist id="dish-list">
                        <option value="Jollof Rice">
                        <option value="Tagine">
                        <option value="Injera">
                        <option value="Isombe">
                        <option value="Bunny Chow">
                        <option value="Fufu">
                        <option value="Ugali">
                        <option value="Egusi Soup">
                        <option value="Couscous">
                    </datalist>
                </div>

                <!-- MESSAGE -->
                <div class="form-group">
                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        placeholder="Write your message here..."
                        required></textarea>

                    <p class="error-msg" id="message-error" aria-live="polite"></p>
                </div>

                <!-- SUBMIT -->
                <button type="submit" class="btn">
                    Send Message
                </button>

            </form>

            <!-- SUCCESS MESSAGE -->
            <div
                id="confirmation"
                class="confirmation hidden"
                role="status"
                aria-live="polite">
            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <p>
                &copy; 2026 Taste of Africa.
                Celebrating African cuisine and culture.
            </p>
        </div>
    </footer>

</body>
</html>
