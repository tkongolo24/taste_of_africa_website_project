
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Explore African recipes, filter dishes by region, and save your favourite meals.">

    <title>African Recipes | Taste of Africa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- NAVIGATION -->
    <header class="site-header">
        <div class="container header-inner">

            <a href="index.html" class="logo">Taste of Africa</a>

            <nav aria-label="Main navigation">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="recipes.html" aria-current="page">Recipes</a></li>
                    <li><a href="region-east.html">Regions</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

            <button
                id="theme-toggle"
                class="theme-toggle"
                type="button"
                aria-label="Toggle dark and light mode">
                🌙
            </button>

        </div>
    </header>

    <main>

        <!-- PAGE BANNER -->
        <header class="page-banner">
            <h1>African Recipes</h1>
            <p>Discover African flavours, filter dishes by region, and save your favourites to try later.</p>
        </header>

        <!-- RECIPE COLLECTION -->
        <section class="section container" aria-label="Recipe collection">

            <div class="filter-bar" role="group" aria-label="Filter recipes by region">
                <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">
                    All
                </button>

                <button type="button" class="filter-btn" data-filter="west-africa" aria-pressed="false">
                    West Africa
                </button>

                <button type="button" class="filter-btn" data-filter="north-africa" aria-pressed="false">
                    North Africa
                </button>

                <button type="button" class="filter-btn" data-filter="east-africa" aria-pressed="false">
                    East Africa
                </button>
            </div>

            <div class="grid" id="recipe-grid">

                <!-- JOLLOF RICE -->
                <article class="card recipe-card" data-region="west-africa" data-id="jollof">

                    <figure>
                        <img src="images/jollof.jpg"
                             alt="A pot of red jollof rice with fried plantain">

                        <figcaption>
                            <strong>Jollof Rice</strong>
                            West Africa
                        </figcaption>
                    </figure>

                    <div class="card-body">
                        <div class="card-actions">
                            <a class="btn" href="recipe-jollof.html">View recipe</a>

                            <button type="button" class="fav-btn" data-id="jollof">
                                🤍 Favorite
                            </button>
                        </div>
                    </div>

                </article>

                <!-- MOROCCAN TAGINE -->
                <article class="card recipe-card" data-region="north-africa" data-id="tagine">

                    <figure>
                        <img src="images/tagine.jpg"
                             alt="A clay tagine of lamb with prunes and almonds">

                        <figcaption>
                            <strong>Moroccan Tagine</strong>
                            North Africa
                        </figcaption>
                    </figure>

                    <div class="card-body">
                        <div class="card-actions">
                            <a class="btn" href="recipe-tagine.html">View recipe</a>

                            <button type="button" class="fav-btn" data-id="tagine">
                                🤍 Favorite
                            </button>
                        </div>
                    </div>

                </article>

                <!-- INJERA -->
                <article class="card recipe-card" data-region="east-africa" data-id="injera">

                    <figure>
                        <img src="images/injera.jpg"
                             alt="Injera flatbread topped with Ethiopian stews">

                        <figcaption>
                            <strong>Injera</strong>
                            East Africa
                        </figcaption>
                    </figure>

                    <div class="card-body">
                        <div class="card-actions">
                            <a class="btn" href="recipe-injera.html">View recipe</a>

                            <button type="button" class="fav-btn" data-id="injera">
                                🤍 Favorite
                            </button>
                        </div>
                    </div>

                </article>

                <!-- ISOMBE -->
                <article class="card recipe-card" data-region="east-africa" data-id="isombe">

                    <figure>
                        <img src="images/isombe.jpg"
                             alt="A bowl of Rwandan isombe made with cassava leaves">

                        <figcaption>
                            <strong>Isombe</strong>
                            East Africa
                        </figcaption>
                    </figure>

                    <div class="card-body">
                        <div class="card-actions">
                            <a class="btn" href="recipe-isombe.html">View recipe</a>

                            <button type="button" class="fav-btn" data-id="isombe">
                                🤍 Favorite
                            </button>
                        </div>
                    </div>

                </article>

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <p>
                &copy; 2026 Taste of Africa.
                Celebrating African cuisine and culture.
            </p>
        </div>
    </footer>

</body>
</html>
